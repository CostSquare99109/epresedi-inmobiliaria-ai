version: "3.9"

# Local-first infrastructure only (no cloud services).
# Run: docker compose up -d
services:
  postgres:
    # pgvector-enabled image, avoids manual pgvector compilation
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: inmobiliaria
      POSTGRES_PASSWORD: inmobiliaria
      POSTGRES_DB: inmobiliaria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmobiliaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
